<!DOCTYPE html>
<html>
<head>
    <title>Edit Question</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            padding: 30px;
            border-radius: 15px;
            background: #1e2a38;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            text-align: center;
            transform: perspective(1000px) rotateX(5deg);
            transition: 0.3s;
        }

        .container:hover {
            transform: perspective(1000px) rotateX(0deg) scale(1.02);
        }

        h2 {
            color: #ffffff;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            outline: none;
            background: #2f3e52;
            color: #fff;
            font-size: 14px;
        }

        input:focus {
            background: #3b4d63;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #3a7bd5;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            background: #2f6ad9;
        }

        button:active {
            transform: scale(0.98);
        }

    </style>
</head>
<body>

<div class="container">
    <h2>Edit Question</h2>

    <form method="POST">
        <input type="text" name="question" value="{{ question[1] }}" required>
        <input type="text" name="option1" value="{{ question[2] }}">
        <input type="text" name="option2" value="{{ question[3] }}">
        <input type="text" name="option3" value="{{ question[4] }}">
        <input type="text" name="option4" value="{{ question[5] }}">
        <input type="text" name="answer" value="{{ question[6] }}">

        <button type="submit">Update</button>
    </form>
</div>

</body>
</html>
