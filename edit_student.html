<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .card {
            background: #1e2a38;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            width: 320px;
            text-align: center;

            /* 3D effect */
            transform: perspective(1000px) rotateX(5deg);
            transition: 0.3s;
        }

        .card:hover {
            transform: perspective(1000px) rotateX(0deg) scale(1.02);
        }

        h2 {
            margin-bottom: 20px;
            color: #ffffff;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            background: #2f3e52;
            color: #fff;
        }

        input:focus {
            outline: none;
            background: #3b4d63;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #3a7bd5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        button:hover {
            background: #2f6ad9;
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Edit Student</h2>

    <form action="/update_student/{{ student[0] }}" method="POST">
        <input type="text" name="name" value="{{ student[1] }}" required>
        <input type="text" name="seatno" value="{{ student[2] }}" required>

        <button type="submit">Update</button>
    </form>
</div>

</body>
</html>
