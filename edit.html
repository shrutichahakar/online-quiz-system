<!DOCTYPE html>
<html>
<head>
    <title>Edit</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 420px;
            padding: 35px;
            background: rgba(255,255,255,0.06);
            border-radius: 18px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            backdrop-filter: blur(18px);
            text-align: center;
            transform: perspective(1000px) rotateX(5deg);
            transition: 0.3s;
        }

        .container:hover {
            transform: perspective(1000px) rotateX(0deg) scale(1.03);
        }

        h2 {
            margin-bottom: 25px;
            color: #00e6e6;
            font-size: 26px;
        }

        input {
            width: 92%;
            padding: 14px;
            margin: 12px 0;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 18px; /* increased font */
            background: rgba(255,255,255,0.15);
            color: #ffffff; /* white text */
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.7);
            transition: 0.3s;
        }

        input::placeholder {
            color: #bbb;
        }

        input:focus {
            background: rgba(255,255,255,0.2);
            box-shadow: 0 0 12px #00e6e6;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 18px;
            background: linear-gradient(45deg, #00e6e6, #0072ff);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
            box-shadow: 0 12px 25px rgba(0,0,0,0.6);
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 18px 40px rgba(0,0,0,0.9);
        }

    </style>

</head>
<body>

<div class="container">

    <h2>Edit Question</h2>

    <form action="/update/{{ q[0] }}" method="POST">
        <input type="text" name="question" value="{{ q[1] }}" required><br>
        <input type="text" name="option1" value="{{ q[2] }}" required><br>
        <input type="text" name="option2" value="{{ q[3] }}" required><br>
        <input type="text" name="option3" value="{{ q[4] }}" required><br>
        <input type="text" name="option4" value="{{ q[5] }}" required><br>
        <input type="text" name="answer" value="{{ q[6] }}" required><br>

        <button type="submit">Update Question</button>
    </form>

</div>

</body>
</html>
