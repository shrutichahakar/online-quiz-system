<!DOCTYPE html>
<html>
<head>
    <title>Assigned Dashboard</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            margin: 0;
            padding: 0;
            color: #ffffff;
        }

        h2 {
            text-align: center;
            color: #00e6e6;
            margin-top: 25px;
            font-size: 28px;
        }

        .top-bar {
            text-align: center;
            margin: 20px 0;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 8px;
            background: linear-gradient(45deg, #00e6e6, #0072ff);
            color: white;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 18px 40px rgba(0,0,0,0.9);
        }

        .card {
            width: 85%;
            margin: 25px auto;
            background: rgba(255,255,255,0.06);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            backdrop-filter: blur(15px);
            transform: perspective(1000px) rotateX(5deg);
            transition: 0.3s;
        }

        .card:hover {
            transform: perspective(1000px) rotateX(0deg) scale(1.02);
        }

        h3 {
            margin-bottom: 15px;
            color: #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(255,255,255,0.05);
        }

        th {
            background: linear-gradient(45deg, #00e6e6, #0072ff);
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #ffffff;
        }

        tr:hover {
            background: rgba(255,255,255,0.1);
        }

    </style>
</head>

<body>

    <h2>Quiz Results Dashboard</h2>

    <div class="top-bar">
        <a href="/admin" class="btn">⬅ Back</a>
        <a href="/logout" class="btn">🚪 Logout</a>
    </div>

     <!-- Quiz Sections -->
    {% for title, records in grouped.items() %}
    <div class="card">

        <h3>Quiz Title: {{ title }}</h3>

        <table>
            <tr>
                <th>Name</th>
                <th>Seat No</th>
                <th>Score</th>
                <th>Total</th>
            </tr>

            {% for r in records %}
            <tr>
                <td>{{ r[0] }}</td>
                <td>{{ r[1] }}</td>
                <td>{{ r[2] }}</td>
                <td>{{ r[3] }}</td>
            </tr>
            {% endfor %}

        </table>

    </div>
    {% endfor %}

</body>
</html>
