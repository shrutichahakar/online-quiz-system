<!DOCTYPE html>
<html>
<head>
    <title>Home</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;

            background: linear-gradient(135deg, #0f172a, #020617);
            color: #e2e8f0;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;

            perspective: 1000px;
        }

        .container {
            text-align: center;
            padding: 40px;

            background: rgba(30, 41, 59, 0.85);
            border-radius: 20px;

            box-shadow: 0 20px 50px rgba(0,0,0,0.6);

            transform-style: preserve-3d;
            backface-visibility: hidden;
            transition: transform 0.4s ease;
        }

        /* Reduced tilt to prevent hiding */
        .container:hover {
            transform: rotateY(3deg) rotateX(3deg) scale(1.02);
        }

        h2 {
            margin-bottom: 25px;
            color: #ffffff;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.6);
        }

        .btn {
            display: inline-block;
            width: 220px;
            padding: 12px;
            margin: 10px;

            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;

            color: white;
            background: linear-gradient(135deg, #38bdf8, #6366f1);

            box-shadow: 0 6px 0 #1e3a8a;
            transition: all 0.2s ease;

            /* 🔥 Fix: keep buttons visible in 3D */
            transform: translateZ(40px);
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.05) translateZ(40px);
            background: linear-gradient(135deg, #22c55e, #0ea5e9);
        }

        .btn:active {
            transform: translateY(3px) translateZ(40px);
            box-shadow: 0 2px 0 #1e3a8a;
        }
    </style>

</head>
<body>

<div class="container">
    <h2>Quiz System</h2>

    <a href="/admin_login" class="btn">Admin Login</a><br>
    <a href="/admin_register" class="btn">Admin Register</a><br>
    <a href="/student_login" class="btn">Student Login</a>
</div>

</body>
</html>
