<!DOCTYPE html>
<html>
<head>
    <title>Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            border: 1px solid #ccc;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input {
            display: block;
            margin: 10px auto;
            padding: 8px;
            width: 200px;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Login</h2>

    <!-- Connect form to /quiz -->
    <form method="POST" action="/student_login">
        <input type="text" name="name" placeholder="Name" required>
        <input type="text" name="seatno" placeholder="Seat No" required>

        <button type="submit">Start Quiz</button>
    </form>
</div>

</body>
</html>
